<!DOCTYPE html>
<html>
<head>
    <title>Calcly</title>
    <link rel="stylesheet" href="style.css?v=19">
</head>

<body>

    <div id="clock">00:00:00</div>

    <div id="ad-panel" class="ad-panel">
        <div class="ad-label">ADVERTISEMENT</div>
        <div class="ad-content">Your advertisement will appear here</div>
    </div>

    <div class="calculator-area">

        <div id="history">
            <h2>History</h2>

            <div class="history-list">
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
                <div class="history-item empty-history"></div>
            </div>

            <button id="clear-history">Clear All History</button>
        </div>

        <div class="calculator">

            <h1>Calcly</h1>

            <div id="display">0</div>

            <button id="copy-button">Copy</button>

            <div class="buttons">

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>/</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>*</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>

                <button>c</button>
                <button>0</button>
                <button>.</button>
                <button>+</button>

                <button>⌫</button>
                <button>±</button>
                <button>%</button>
                <button>=</button>

            </div>

        </div>

    </div>

    <script src="script.js?v=6"></script>

</body>

</html>
