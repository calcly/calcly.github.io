<!DOCTYPE html>
<html>
<head>
    <title>Calcly</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

    <div id="clock">00:00:00</div>

    <div class="calculator-area">

        <div id="history">
            <h2>History</h2>
        </div>

        <div class="calculator">

            <h1>Calcly</h1>

            <div id="display">0</div>

            <div class="buttons">

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>/</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>*</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>

                <button>c</button>
                <button>0</button>
                <button>.</button>
                <button>+</button>

                <button>⌫</button>
                <button>±</button>
                <button>%</button>
                <button>=</button>

            </div>

        </div>

    </div>

    <script src="script.js?v=3"></script>

</body>

</html>
